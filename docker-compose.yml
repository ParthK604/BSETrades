version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  mock-bse:
    build: ./mock-BSE
    ports:
      - "4000:4000"

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    depends_on:
      - redis
      - mock-bse
    environment:
      - REDIS_URL=redis://redis:6379
      - BSE_URL=http://mock-bse:4000